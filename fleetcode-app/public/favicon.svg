<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="fc-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="fc-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background container with rounded corners & border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#fc-bg)" stroke="url(#fc-glow)" stroke-width="2" />
  
  <!-- Subtle inner circuit border -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.6"/>

  <!-- Left Code Bracket < -->
  <path d="M22 20 L12 32 L22 44" fill="none" stroke="url(#fc-accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Right Code Bracket > -->
  <path d="M42 20 L52 32 L42 44" fill="none" stroke="url(#fc-accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Center Slash -->
  <path d="M35 18 L26 46" fill="none" stroke="url(#fc-glow)" stroke-width="4" stroke-linecap="round"/>

  <!-- Central pulse accent node -->
  <circle cx="32" cy="32" r="3" fill="#38bdf8" filter="url(#glow)"/>
</svg>